<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Display</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background-color: #181818;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        img {
            max-width: 100%;
            max-height: 100vh;
            width: auto;
            height: auto;
            display: block;
        }
    </style>
</head>
<body>
    <!-- Replace "your-image.jpg" with your actual image file name -->
    <img src="menu/DESSERTS.jpg" alt="">
</body>
</html>
